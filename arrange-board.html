<title>편곡보드</title>
<style>
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e42;
  --accent:#7c6ff7;--text:#e8e8f0;--muted:#888899;--danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-size:18px;font-weight:800;color:var(--accent);white-space:nowrap;}
.song-meta{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:flex-end;}
.mg{display:flex;flex-direction:column;}
.ml{font-size:9px;color:var(--muted);margin-bottom:2px;}
.mi{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;outline:none;transition:border-color .2s;}
.mi:focus{border-color:var(--accent);}
.mi.t{width:160px;font-weight:600;}
.mi.s{width:68px;text-align:center;}
.hdr-act{display:flex;gap:5px;}

/* ── BUTTONS ── */
.btn{border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;}
.bp{background:var(--accent);color:#fff;}.bp:hover{background:#6b5fe6;}
.bg{background:transparent;color:var(--muted);border:1px solid var(--border);}.bg:hover{color:var(--text);border-color:var(--accent);}
.bsm{padding:3px 8px;font-size:10px;}
.bd{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}.bd:hover{background:rgba(239,68,68,.25);}

/* ── LAYOUT ── */
.app{flex:1;display:flex;overflow:hidden;}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sb-hdr{padding:10px 11px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-t{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:1px 6px;font-size:10px;font-weight:700;}
.sl{overflow-y:auto;flex:1;padding:4px;}
.si{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;}
.si:hover{background:var(--surface2);}
.si.act{background:var(--surface2);border-color:var(--accent);}
.si-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.si-nm{font-size:12px;font-weight:600;flex:1;}
.si-bars{font-size:10px;color:var(--muted);}
.dh{color:var(--muted);opacity:0;font-size:11px;cursor:grab;}
.si:hover .dh{opacity:1;}

/* ── MAIN AREA ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── TIMELINE CONTROLS ── */
.tl-ctrl{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:9px;flex-shrink:0;}
.tl-lbl{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap;}
.vm-wrap{display:flex;background:var(--surface2);border-radius:6px;padding:2px;gap:2px;}
.vmb{padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.vmb.on{background:var(--accent);color:#fff;}
.spacer{flex:1;}

/* ── TIMELINE SCROLL AREA ── */
.tl-scroll{overflow-x:auto;overflow-y:hidden;flex-shrink:0;}
.tl-scroll::-webkit-scrollbar{height:4px;}
.tl-rows{display:flex;flex-direction:column;}
/* section mode: fill width */
.tl-rows.sm{min-width:100%;}
/* bar/beat/eighth mode: expand for horizontal scroll */
.tl-rows.gm{min-width:max-content;}

/* ── META ROW ── */
.meta-row{display:flex;background:rgba(0,0,0,.35);border-bottom:1px solid var(--border);}
.ms{display:flex;align-items:center;gap:6px;padding:4px 9px;font-size:10px;border-right:1px dashed var(--border);cursor:pointer;position:relative;white-space:nowrap;transition:background .15s;}
.ms:hover{background:rgba(124,111,247,.1);}
.mk{color:var(--accent);font-weight:700;}
.mb{color:#f97316;font-weight:700;}
.mts{color:#22c55e;font-weight:700;}
.mcd{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* ── SECTION BLOCKS (section mode) ── */
.sb-row{display:flex;gap:3px;padding:8px 10px;align-items:stretch;min-height:60px;}
.tl-blk{border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;justify-content:space-between;min-width:50px;border:2px solid transparent;user-select:none;}
.tl-blk:hover{filter:brightness(1.15);transform:translateY(-2px);}
.tl-blk.sel{border-color:#fff!important;box-shadow:0 4px 16px rgba(0,0,0,.5);}
.tl-blk.dl{box-shadow:-3px 0 0 #fff!important;}
.tl-blk.dr{box-shadow:3px 0 0 #fff!important;}
.tbn{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbb{font-size:9px;color:rgba(255,255,255,.7);}

/* ── GRID MODE (bar/beat/eighth) ── */
.gm-area{padding:6px 10px 8px;}
.gm-hdrs{display:flex;}
.gm-hdr{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border-radius:7px 7px 0 0;padding:5px 7px;cursor:pointer;user-select:none;border:2px solid transparent;border-bottom:none;white-space:nowrap;overflow:hidden;flex-shrink:0;transition:all .15s;}
.gm-hdr:hover{filter:brightness(1.1);}
.gm-hdr.sel{border-color:#fff;border-bottom:none;}
.gm-barnums{display:flex;}
.gm-bn{font-size:9px;color:var(--muted);text-align:center;border-left:3px solid rgba(180,180,220,.7);padding:2px 2px;flex-shrink:0;background:rgba(0,0,0,.25);}
.gm-strip{display:flex;}
.gm-bgrp{display:flex;flex-shrink:0;}
.gm-cell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text);padding:4px 3px;background:var(--surface2);flex-shrink:0;white-space:nowrap;border-bottom:1px solid var(--border);}
.gm-cell.bar-start{border-left:3px solid rgba(180,180,220,.7);}
.gm-cell.bd4{border-left:1px solid rgba(150,150,180,.5);}
.gm-cell.bd8{border-left:1px dashed rgba(130,130,160,.35);}
.gm-cell.mt{color:rgba(100,100,120,.6);}

/* ── EXPANDED AREA (outside scroll) ── */
.exp-area{flex:1;overflow-y:auto;overflow-x:hidden;}
.exp-card{background:var(--surface);border-top:1px solid var(--border);animation:ea .2s ease;}
@keyframes ea{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.exp-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.exp-stripe{width:4px;min-height:30px;border-radius:2px;flex-shrink:0;}
.exp-ttl{font-size:16px;font-weight:800;flex:1;}
.exp-sub{font-size:11px;color:var(--muted);}
.exp-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;}
.exp-full{grid-column:1/-1;}
.elbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.exp-instrs{display:flex;flex-direction:column;gap:4px;}
.exp-instr{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--surface2);border-radius:6px;}
.exp-instr svg{width:18px;height:18px;flex-shrink:0;}
.ei-nm{font-size:11px;font-weight:700;}
.ei-dt{font-size:9px;color:var(--muted);}
.exp-memo{background:var(--surface2);border-radius:6px;padding:9px;font-size:11px;line-height:1.6;white-space:pre-wrap;min-height:40px;}
.btn-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;}
.btn-x:hover{color:var(--text);}

/* ── CHORD GRID ── */
.cg-wrap{overflow-x:auto;}
.cg-inner{display:inline-flex;flex-direction:column;}
.cg-rows{display:flex;}
/* Each bar group: column flex with thick left border = bar line */
.cg-bg{display:flex;flex-direction:column;border-left:3px solid rgba(210,210,240,.85);flex-shrink:0;}
.cg-bg:first-child{border-left:3px solid rgba(210,210,240,.85);}
.cg-blbl{font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding:2px 4px;background:rgba(0,0,0,.3);white-space:nowrap;}
.cg-cells{display:flex;}
/* Cell wrappers: separator borders */
.cg-cw{flex-shrink:0;}                                           /* bar div=1: no extra border */
.cg-cw.bs4{border-left:1px solid rgba(150,150,190,.6);}          /* thin: beat separator (4-div) */
.cg-cw.bs8q{border-left:1px solid rgba(150,150,190,.5);}         /* thin: quarter-note separator in 8-div */
.cg-cw.bs8e{border-left:1px dashed rgba(130,130,160,.35);}       /* dashed: eighth-note separator */
/* Chord input */
.cg-inp{height:30px;min-width:62px;background:var(--surface2);border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;text-align:center;outline:none;padding:0 5px;font-family:inherit;display:block;transition:background .15s;}
.cg-inp:focus{background:rgba(124,111,247,.18);}
/* Display cell (read-only) */
.cg-dp{height:28px;min-width:62px;background:var(--surface2);border-bottom:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;padding:0 4px;white-space:nowrap;}
.cg-dp.em{color:rgba(100,100,120,.6);}

/* Chord div mode selector */
.cg-mode{display:flex;gap:3px;margin-bottom:7px;}
.cgm-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.cgm-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── EDITOR PANEL ── */
.ed-panel{background:var(--surface);border-top:2px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;transition:height .3s cubic-bezier(.4,0,.2,1);height:40px;overflow:hidden;}
.ed-panel.open{height:48vh;}
.ed-hnd{display:flex;align-items:center;gap:8px;padding:0 16px;height:40px;flex-shrink:0;border-bottom:1px solid transparent;}
.ed-panel.open .ed-hnd{border-bottom-color:var(--border);}
.ed-lbl{font-size:11px;font-weight:700;color:var(--muted);flex:1;}
.ed-lbl .sn{color:var(--text);}
.ed-tog{background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer;font-size:10px;transition:all .15s;}
.ed-tog:hover{border-color:var(--accent);color:var(--accent);}
.ed-body{flex:1;overflow-y:auto;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ef{grid-column:1/-1;}
.ec{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;}
.ect{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.ed-shdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.ed-cdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.ed-tti{font-size:15px;font-weight:800;background:none;border:none;color:var(--text);outline:none;flex:1;}
.ed-tti:focus{border-bottom:2px solid var(--accent);}
.ef2{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;outline:none;transition:border-color .2s;}
.ef2:focus{border-color:var(--accent);}
.memo2{resize:none;font-family:inherit;line-height:1.6;}
.cs-row{display:flex;gap:4px;flex-wrap:wrap;}
.csw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;}
.csw.on,.csw:hover{border-color:#fff;transform:scale(1.2);}
.il{display:flex;flex-direction:column;gap:5px;}
.ir{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);transition:border-color .15s;}
.ir:hover{border-color:var(--accent);}
.iib{width:28px;height:28px;border-radius:5px;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);padding:2px;flex-shrink:0;transition:all .15s;}
.iib:hover{border-color:var(--accent);}
.iib svg{width:18px;height:18px;}
.ini{flex:1;background:none;border:none;color:var(--text);font-size:11px;font-weight:600;outline:none;}
.idi{background:none;border:none;color:var(--muted);font-size:10px;outline:none;width:120px;text-align:right;}
.rmb{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;border-radius:3px;padding:1px 3px;transition:all .15s;}
.rmb:hover{color:var(--danger);background:rgba(239,68,68,.1);}

/* ── MODALS ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;}
.mov.on{opacity:1;pointer-events:all;}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:18px;width:360px;max-width:92vw;transform:translateY(18px);transition:transform .2s;}
.mov.on .mbox{transform:translateY(0);}
.mt2{font-size:14px;font-weight:800;margin-bottom:12px;}
.fg{margin-bottom:10px;}
.fg label{font-size:10px;color:var(--muted);margin-bottom:4px;display:block;font-weight:600;}
.fg input,.fg select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:var(--accent);}
.mact{display:flex;gap:5px;justify-content:flex-end;margin-top:14px;}

/* ── ICON PICKER ── */
.ipov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;}
.ipov.on{opacity:1;pointer-events:all;}
.ipbox{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;width:520px;max-width:95vw;max-height:76vh;display:flex;flex-direction:column;transform:translateY(18px);transition:transform .2s;}
.ipov.on .ipbox{transform:translateY(0);}
.iphdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ipttl{font-size:14px;font-weight:800;}
.ipx{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.ipsrc{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 9px;font-size:12px;outline:none;margin-bottom:10px;}
.ipsrc:focus{border-color:var(--accent);}
.ipscr{overflow-y:auto;flex:1;}
.ipcat{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:9px 0 5px;}
.ipgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.ipopt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.ipopt:hover{background:var(--surface2);border-color:var(--accent);}
.ipopt.on{background:rgba(124,111,247,.15);border-color:var(--accent);}
.ipopt svg{width:26px;height:26px;}
.ipnm{font-size:8px;color:var(--muted);text-align:center;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── META POPUP ── */
.mpop{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--accent);border-radius:9px;padding:12px;width:220px;box-shadow:0 8px 28px rgba(0,0,0,.6);display:none;}
.mpop.on{display:block;}
.mptt{font-size:11px;font-weight:800;margin-bottom:8px;}
.mpr{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.mpl{font-size:9px;color:var(--muted);width:32px;flex-shrink:0;}
.mpi{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:3px 6px;font-size:11px;outline:none;}
.mpi:focus{border-color:var(--accent);}
.mpact{display:flex;gap:4px;margin-top:8px;}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;color:var(--muted);gap:8px;font-size:13px;}

/* ── SCROLL ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.faded{opacity:.35;}

/* ── WELCOME SCREEN ── */
.welcome-ov{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;align-items:center;justify-content:center;transition:opacity .4s;}
.welcome-ov.hidden{opacity:0;pointer-events:none;}
.welcome-box{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:24px;animation:wba .65s ease;}
@keyframes wba{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.welcome-icon{font-size:76px;line-height:1;filter:drop-shadow(0 4px 20px rgba(124,111,247,.5));}
.welcome-title{font-size:50px;font-weight:900;color:var(--accent);letter-spacing:-2px;}
.welcome-sub{font-size:14px;color:var(--muted);max-width:300px;line-height:1.7;}
.welcome-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.wbtn{padding:14px 34px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border:none;display:inline-flex;align-items:center;gap:8px;}
.wbtn-p{background:var(--accent);color:#fff;box-shadow:0 4px 24px rgba(124,111,247,.45);}.wbtn-p:hover{background:#6b5fe6;transform:translateY(-3px);box-shadow:0 8px 28px rgba(124,111,247,.55);}
.wbtn-s{background:var(--surface);color:var(--text);border:1px solid var(--border);}.wbtn-s:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);}

/* ── SONG METAS (header multi-key/bpm/time) ── */
.song-metas-wrap{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;}
.meta-set{display:flex;align-items:flex-end;gap:2px;padding:2px 5px 2px 5px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);}
.meta-set .mg{gap:0;}
.meta-arrow-lbl{color:var(--accent);font-size:16px;font-weight:900;padding:0 1px;align-self:flex-end;margin-bottom:4px;line-height:1;}
.meta-add-btn{height:28px;padding:0 8px;font-size:15px;font-weight:700;cursor:pointer;background:transparent;border:1px dashed var(--border);border-radius:6px;color:var(--muted);transition:all .15s;align-self:flex-end;margin-bottom:1px;line-height:1;}
.meta-add-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── DASHBOARD ── */
.dash-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;flex-direction:column;align-items:center;padding:18px 24px 32px;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .25s;}
.dash-ov.on{opacity:1;pointer-events:all;}
.dash-toolbar{display:flex;align-items:center;gap:8px;width:1122px;max-width:100%;margin-bottom:14px;flex-shrink:0;}
.dash-ttl-bar{font-size:14px;font-weight:800;color:#fff;flex:1;}
.dash-page{width:1122px;min-height:794px;max-width:calc(100vw - 48px);background:#fff;color:#1a1a24;border-radius:6px;margin-bottom:22px;padding:34px 40px;box-shadow:0 8px 48px rgba(0,0,0,.6);display:flex;flex-direction:column;flex-shrink:0;}
.dash-pg-hdr{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:3px solid #7c6ff7;padding-bottom:14px;margin-bottom:18px;}
.dash-song-title{font-size:26px;font-weight:900;color:#111;}
.dash-song-sub{font-size:11px;color:#777;margin-top:3px;}
.dash-metas-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px;}
.dash-chip{background:#ebe9ff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:#5244c9;}
.dash-chip-bpm{background:#fff3e8;color:#c2540a;}
.dash-chip-time{background:#e8f5e9;color:#2e7d32;}
.dash-chip-genre{background:#f3e5f5;color:#6a1b9a;}
.dash-chip-arr{color:#7c6ff7;font-weight:900;font-size:15px;}
.dash-pg-num{font-size:10px;color:#aaa;text-align:right;white-space:nowrap;}
.dash-sec-lbl{font-size:10px;font-weight:800;color:#7c6ff7;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;margin-top:4px;}
.dash-tl{display:flex;gap:4px;height:56px;margin-bottom:14px;}
.dash-tl-blk{border-radius:7px;display:flex;flex-direction:column;justify-content:center;padding:6px 8px;min-width:36px;overflow:hidden;}
.dash-tl-nm{font-size:10px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-tl-sub{font-size:8px;color:rgba(255,255,255,.8);margin-top:1px;}
.dash-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.dash-tbl th{background:#f0efff;color:#4a3fbf;font-weight:800;padding:6px 10px;text-align:left;border-bottom:2px solid #c8c4f0;}
.dash-tbl td{padding:5px 10px;border-bottom:1px solid #eee;vertical-align:middle;}
.dash-tbl tr:last-child td{border-bottom:none;}
.dash-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;flex-shrink:0;}
/* Micro section cards */
.dash-mc{border-left:5px solid #ccc;border-radius:0 9px 9px 0;padding:14px 18px 12px;margin-bottom:14px;background:#fafafa;}
.dash-mc-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:8px;}
.dash-mc-title{font-size:17px;font-weight:900;color:#111;}
.dash-mc-badge{font-size:10px;color:#666;background:#eee;border-radius:12px;padding:2px 8px;white-space:nowrap;}
.dash-mc-meta{font-size:10px;color:#888;margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}
.dash-mc-chip{background:#f0efff;border-radius:12px;padding:2px 7px;color:#5244c9;font-weight:700;}
.dash-mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dash-mc-full{grid-column:1/-1;}
.dash-mc-lbl{font-size:9px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.dash-mc-val{font-size:11px;line-height:1.6;color:#333;}
.dash-instr-list{display:flex;flex-wrap:wrap;gap:4px;}
.dash-instr-tag{background:#e8f0fe;border-radius:5px;padding:2px 8px 2px 5px;font-size:10px;font-weight:600;color:#1a56db;display:inline-flex;align-items:center;gap:4px;}
.dash-instr-tag svg{width:14px;height:14px;flex-shrink:0;}
.dash-chord-wrap{display:flex;gap:2px;flex-wrap:wrap;}
.dash-chord-bar{display:flex;gap:1px;background:#e8e8f5;border-radius:5px;padding:3px 5px;align-items:center;}
.dash-chord-bar-lbl{font-size:8px;color:#888;margin-right:2px;}
.dash-chord-cell{background:#fff;border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700;color:#3730a3;border:1px solid #ddd;}
.dash-chord-cell.em{color:#bbb;border-color:#eee;}
.dash-memo{font-size:11px;color:#444;line-height:1.65;white-space:pre-wrap;background:#fff;border-radius:6px;padding:8px 10px;border:1px solid #e5e5e5;}

/* ════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════ */
const COLORS=['#7c6ff7','#a855f7','#ec4899','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#ef4444','#14b8a6'];
// Cell width per view mode
const CW={bar:88,beat:54,eighth:36};
// Cells per bar per view mode
const DC={bar:1,beat:4,eighth:8};

/* ════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════ */
let G={
  secs:[],       // all sections
  vm:'section',  // viewMode: 'section'|'bar'|'beat'|'eighth'
  expIdx:null,   // expanded detail section index
  edIdx:null,    // editor section index
  edOpen:false,  // editor panel open
  ipTgt:null,    // icon picker target {si,ii}
  mpTgt:null,    // meta popup target section index
  songMetas:[{key:'',bpm:'',time:''}],  // global key/bpm/time sets (multi)
};

/* ════════════════════════════════════════════════
   CHORD GRID DATA
════════════════════════════════════════════════ */
function ensureCG(sec){
  if(!sec.cg) sec.cg={div:1,cells:[]};
  const bars=parseInt(sec.bars)||0, d=sec.cg.div;
  while(sec.cg.cells.length<bars) sec.cg.cells.push(Array(d).fill(''));
  sec.cg.cells.length=bars;
  sec.cg.cells=sec.cg.cells.map(r=>{const c=r.slice(0,d);while(c.length<d)c.push('');return c;});
}

function migrateSec(sec){
  if(sec.chords&&!sec.cg){
    const bars=parseInt(sec.bars)||4;
    sec.cg={div:1,cells:Array.from({length:bars},(_,i)=>[sec.chords[i]||''])};
  }
  if(sec.chordGrid&&!sec.cg){
    sec.cg=sec.chordGrid;
    // rename division → div
    if(sec.cg.division&&!sec.cg.div){sec.cg.div=sec.cg.division;delete sec.cg.division;}
  }
  ensureCG(sec);
}

function changeCGDiv(si,newDiv){
  const sec=G.secs[si]; if(!sec) return;
  const old=sec.cg;
  sec.cg.cells=old.cells.map(row=>{
    if(newDiv===1) return[row[0]||''];
    if(newDiv===4){
      if(old.div===1) return[row[0]||'','','',''];
      if(old.div===8) return[row[0]||'',row[2]||'',row[4]||'',row[6]||''];
      return row.slice(0,4).concat(Array(Math.max(0,4-row.length)).fill(''));
    }
    if(newDiv===8){
      if(old.div===1) return[row[0]||'','','','','','','',''];
      if(old.div===4){const r=[];row.forEach(c=>r.push(c||'',''));return r.slice(0,8);}
      return row.slice(0,8).concat(Array(Math.max(0,8-row.length)).fill(''));
    }
    return row;
  });
  sec.cg.div=newDiv;
  ensureCG(sec);
}

// Get chord to display for a given (bar, cell) in the timeline's view mode
function cgGetForVM(sec,bar,cell,vmDiv){
  const cg=sec.cg; if(!cg||!cg.cells[bar]) return'';
  const row=cg.cells[bar];
  if(vmDiv===1) return row[0]||'';
  if(vmDiv===4){
    if(cg.div===1) return cell===0?(row[0]||''):'';
    if(cg.div===4) return row[cell]||'';
    if(cg.div===8) return row[cell*2]||'';
  }
  if(vmDiv===8){
    if(cg.div===1) return cell===0?(row[0]||''):'';
    if(cg.div===4) return cell%2===0?(row[cell/2]||''):'';
    if(cg.div===8) return row[cell]||'';
  }
  return'';
}

// Get the separator CSS class for a cell within a bar
function sepClass(cellIdx,div){
  if(cellIdx===0) return''; // bar line handled by parent border
  if(div===8) return cellIdx%2===0?'bs8q':'bs8e'; // even=quarter boundary, odd=eighth
  if(div===4) return'bs4';
  return'';
}

/* ════════════════════════════════════════════════
   CHORD GRID HTML
════════════════════════════════════════════════ */
function cgHTML(sec,editable){
  ensureCG(sec);
  const {div,cells}=sec.cg;
  const bars=parseInt(sec.bars)||0;
  if(!bars) return'<div class="empty" style="height:50px">마디 없음</div>';

  // Compute display width for a chord string
  const cellW=(chord)=>{
    const sizer=document.getElementById('sizer');
    sizer.textContent=chord||'Am7';
    return Math.max(62,sizer.offsetWidth+14);
  };

  let h='<div class="cg-wrap"><div class="cg-inner"><div class="cg-rows">';
  for(let b=0;b<bars;b++){
    const row=cells[b]||Array(div).fill('');
    // Compute bar label width = sum of all cell widths in this bar
    h+=`<div class="cg-bg">`;
    h+=`<div class="cg-blbl">${b+1}마디</div>`;
    h+=`<div class="cg-cells">`;
    for(let c=0;c<div;c++){
      const chord=row[c]||'';
      const w=cellW(chord);
      const sc=sepClass(c,div);
      if(editable){
        h+=`<div class="cg-cw${sc?' '+sc:''}" style="flex-shrink:0">
          <input class="cg-inp" value="${esc(chord)}" style="width:${w}px"
            data-bar="${b}" data-cell="${c}"
            oninput="onCI(this,${b},${c})"
            onkeydown="onCK(event,${b},${c},${div})"
            onfocus="this.select()">
        </div>`;
      } else {
        h+=`<div class="cg-cw${sc?' '+sc:''}" style="flex-shrink:0">
          <div class="cg-dp${!chord?' em':''}" style="width:${w}px">${chord||'–'}</div>
        </div>`;
      }
    }
    h+=`</div></div>`;
  }
  h+='</div></div></div>';
  return h;
}

function onCI(inp,bar,cell){
  const si=G.edIdx; if(si===null) return;
  const sec=G.secs[si]; ensureCG(sec);
  if(!sec.cg.cells[bar]) sec.cg.cells[bar]=Array(sec.cg.div).fill('');
  sec.cg.cells[bar][cell]=inp.value;
  // Auto-resize
  const sizer=document.getElementById('sizer');
  sizer.textContent=inp.value||'Am7';
  inp.style.width=Math.max(62,sizer.offsetWidth+14)+'px';
  save();
}

function onCK(e,bar,cell,div){
  if(e.key==='Tab'){
    e.preventDefault();
    const next=document.querySelector(`#edBody input[data-bar="${bar+1}"][data-cell="0"]`);
    if(next) next.focus();
    return;
  }
  if(e.key==='ArrowRight'){
    e.preventDefault();
    let nb=bar,nc=cell+1;
    if(nc>=div){nc=0;nb=bar+1;}
    const next=document.querySelector(`#edBody input[data-bar="${nb}"][data-cell="${nc}"]`);
    if(next) next.focus();
    return;
  }
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    let nb=bar,nc=cell-1;
    if(nc<0){nb=bar-1;nc=div-1;}
    const next=document.querySelector(`#edBody input[data-bar="${nb}"][data-cell="${nc}"]`);
    if(next) next.focus();
  }
}

/* ════════════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════════════ */
function renderSB(){
  const list=document.getElementById('sbList');
  document.getElementById('sbCnt').textContent=G.secs.length;
  if(!G.secs.length){
    list.innerHTML='<div class="empty">섹션을 추가하세요</div>';return;
  }
  list.innerHTML='';
  G.secs.forEach((sec,si)=>{
    const el=document.createElement('div');
    el.className='si'+(si===G.edIdx?' act':'');
    el.draggable=true; el.dataset.si=si;
    el.innerHTML=`<div class="si-dot" style="background:${sec.color}"></div>
      <div class="si-nm">${sec.name}</div>
      <div class="si-bars">${sec.bars||0}마디</div>
      <div class="dh">⠿</div>`;
    el.addEventListener('click',()=>{G.edIdx=si;renderAll();});
    el.addEventListener('dragstart',sbDS);el.addEventListener('dragover',sbDO);
    el.addEventListener('drop',sbDrp);el.addEventListener('dragend',sbDE);
    list.appendChild(el);
  });
}
let sbSrc=null;
function sbDS(e){sbSrc=+e.currentTarget.dataset.si;e.currentTarget.classList.add('faded');}
function sbDO(e){e.preventDefault();}
function sbDrp(e){
  e.preventDefault();
  const to=+e.currentTarget.dataset.si;
  if(sbSrc===null||sbSrc===to)return;
  const m=G.secs.splice(sbSrc,1)[0];G.secs.splice(to,0,m);
  reIdx(sbSrc,to);renderAll();
}
function sbDE(e){e.currentTarget.classList.remove('faded');sbSrc=null;}
function reIdx(from,to){
  ['expIdx','edIdx'].forEach(k=>{
    if(G[k]===from)G[k]=to;
    else if(G[k]>from&&G[k]<=to)G[k]--;
    else if(G[k]<from&&G[k]>=to)G[k]++;
  });
}

/* ════════════════════════════════════════════════
   TIMELINE
════════════════════════════════════════════════ */
function renderTL(){
  const rows=document.getElementById('tlRows');
  rows.innerHTML='';
  // Section mode: fill container width (no horizontal scroll needed)
  // Grid mode: expand to content width (horizontal scroll)
  rows.className='tl-rows '+(G.vm==='section'?'sm':'gm');

  // Meta row
  rows.appendChild(buildMeta());

  // Section rows
  if(G.vm==='section'){
    rows.appendChild(buildSecRow());
  } else {
    rows.appendChild(buildGridRow());
  }

  // Expanded detail (full-width, outside scroll)
  const expArea=document.getElementById('expArea');
  if(G.expIdx!==null&&G.secs[G.expIdx]){
    expArea.innerHTML='';
    expArea.appendChild(buildExpCard(G.expIdx));
  } else {
    expArea.innerHTML='';
  }
}

/* META ROW */
function buildMeta(){
  const row=document.createElement('div');row.className='meta-row';
  const gm=G.songMetas[0]||{};
  const gKey=gm.key||'',gBpm=gm.bpm||'',gTime=gm.time||'',gGenre=gi('gGenre')||'';

  if(!G.secs.length){
    const seg=document.createElement('div');seg.className='ms';seg.style.flex='1';
    const parts=[];
    if(gKey) parts.push(`<span class="mk">${gKey}</span>`);
    if(gBpm) parts.push(`<span class="mb">${gBpm} BPM</span>`);
    if(gTime) parts.push(`<span class="mts">${gTime}</span>`);
    if(gGenre) parts.push(`<span style="color:var(--muted);font-size:9px">${gGenre}</span>`);
    seg.innerHTML=parts.join('')||'<span style="color:var(--muted);font-size:10px">곡 정보를 입력하세요</span>';
    row.appendChild(seg);return row;
  }

  const total=G.secs.reduce((s,sec)=>s+(parseInt(sec.bars)||0),0)||1;
  let prev={key:gKey,bpm:gBpm,time:gTime,genre:gGenre};

  G.secs.forEach((sec,si)=>{
    const bars=parseInt(sec.bars)||1;
    const seg=document.createElement('div');seg.className='ms';
    if(G.vm==='section'){seg.style.flex=String(bars/total);}
    else{const cw=CW[G.vm]||88,dc=DC[G.vm]||1;seg.style.width=(bars*dc*cw)+'px';seg.style.flexShrink='0';}
    const mo=sec.meta||{};
    const curr={key:mo.key||prev.key,bpm:mo.bpm||prev.bpm,time:mo.time||prev.time,genre:mo.genre||prev.genre};
    const parts=[];
    if(si===0){
      // 첫 섹션: 모든 값 표시
      if(curr.key) parts.push(`<span class="mk">${curr.key}</span>`);
      if(curr.bpm) parts.push(`<span class="mb">${curr.bpm} BPM</span>`);
      if(curr.time) parts.push(`<span class="mts">${curr.time}</span>`);
      if(curr.genre) parts.push(`<span style="color:var(--muted);font-size:9px">${curr.genre}</span>`);
    } else {
      // 이후 섹션: 변경된 값만 화살표와 함께 표시
      if(curr.key!==prev.key) parts.push(`<span class="mk">→${curr.key}</span>`);
      if(curr.bpm!==prev.bpm) parts.push(`<span class="mb">→${curr.bpm} BPM</span>`);
      if(curr.time!==prev.time) parts.push(`<span class="mts">→${curr.time}</span>`);
      if(curr.genre!==prev.genre) parts.push(`<span style="color:var(--muted);font-size:9px">→${curr.genre}</span>`);
    }
    const hasO=!!(mo.key||mo.bpm||mo.time);
    seg.innerHTML=`${hasO?'<span class="mcd"></span>':''}${parts.join('')}`;
    seg.title='더블클릭: 이 위치의 조성/BPM/박자 편집';
    seg.addEventListener('dblclick',ev=>{openMPop(si,ev);ev.stopPropagation();});
    row.appendChild(seg);
    prev=curr;
  });
  return row;
}

/* SECTION MODE: horizontal proportional blocks */
function buildSecRow(){
  const wrap=document.createElement('div');wrap.className='sb-row';
  const total=G.secs.reduce((s,sec)=>s+(parseInt(sec.bars)||0),0)||1;
  if(!G.secs.length){wrap.innerHTML='<div class="empty">섹션을 추가하면 여기에 표시됩니다</div>';return wrap;}
  G.secs.forEach((sec,si)=>{
    const bars=parseInt(sec.bars)||1;
    const blk=document.createElement('div');
    blk.className='tl-blk'+(si===G.expIdx?' sel':'');
    blk.style.cssText=`background:${sec.color};flex:${bars/total}`;
    blk.dataset.si=si;blk.draggable=true;
    blk.innerHTML=`<div class="tbn">${sec.name}</div><div class="tbb">${bars}마디${sec.repeat>1?' ×'+sec.repeat:''}</div>`;
    // single click = expand detail, double click = open editor
    let ct=null;
    blk.addEventListener('click',()=>{
      clearTimeout(ct);
      ct=setTimeout(()=>{G.expIdx=(G.expIdx===si)?null:si;renderTL();},220);
    });
    blk.addEventListener('dblclick',()=>{clearTimeout(ct);openEd(si);});
    blk.addEventListener('dragstart',tlDS);blk.addEventListener('dragover',tlDO);
    blk.addEventListener('drop',tlDrp);blk.addEventListener('dragend',tlDE);
    wrap.appendChild(blk);
  });
  return wrap;
}

/* GRID MODE: bar/beat/eighth with fixed-width columns */
function buildGridRow(){
  const wrap=document.createElement('div');wrap.className='gm-area';
  if(!G.secs.length){wrap.innerHTML='<div class="empty">섹션을 추가하세요</div>';return wrap;}
  const cw=CW[G.vm],dc=DC[G.vm];

  // Section headers
  const hdrs=document.createElement('div');hdrs.className='gm-hdrs';
  G.secs.forEach((sec,si)=>{
    const bars=parseInt(sec.bars)||1;
    const h=document.createElement('div');
    h.className='gm-hdr'+(si===G.expIdx?' sel':'');
    h.style.cssText=`background:${sec.color};width:${bars*dc*cw}px`;
    h.textContent=`${sec.name} (${bars}마디)`;
    h.dataset.si=si;h.draggable=true;
    let ct=null;
    h.addEventListener('click',()=>{clearTimeout(ct);ct=setTimeout(()=>{G.expIdx=(G.expIdx===si)?null:si;renderTL();},220);});
    h.addEventListener('dblclick',()=>{clearTimeout(ct);openEd(si);});
    h.addEventListener('dragstart',tlDS);h.addEventListener('dragover',tlDO);
    h.addEventListener('drop',tlDrp);h.addEventListener('dragend',tlDE);
    hdrs.appendChild(h);
  });
  wrap.appendChild(hdrs);

  // Bar numbers
  const bns=document.createElement('div');bns.className='gm-barnums';
  G.secs.forEach(sec=>{
    for(let b=0;b<(parseInt(sec.bars)||1);b++){
      const bn=document.createElement('div');bn.className='gm-bn';
      bn.style.width=(dc*cw)+'px';bn.textContent=b+1;
      bns.appendChild(bn);
    }
  });
  wrap.appendChild(bns);

  // Chord strip
  const strip=document.createElement('div');strip.className='gm-strip';
  G.secs.forEach(sec=>{
    ensureCG(sec);
    for(let b=0;b<(parseInt(sec.bars)||1);b++){
      const grp=document.createElement('div');grp.className='gm-bgrp';
      for(let c=0;c<dc;c++){
        const cell=document.createElement('div');
        cell.className='gm-cell';
        if(c===0) cell.classList.add('bar-start');
        else if(dc===8) cell.classList.add(c%2===0?'bd4':'bd8');
        else cell.classList.add('bd4');
        cell.style.width=cw+'px';
        const ch=cgGetForVM(sec,b,c,dc);
        cell.textContent=ch||'';
        if(!ch) cell.classList.add('mt');
        grp.appendChild(cell);
      }
      strip.appendChild(grp);
    }
  });
  wrap.appendChild(strip);
  return wrap;
}

/* TIMELINE DRAG & DROP */
let tlSrc=null;
function tlDS(e){tlSrc=+e.currentTarget.dataset.si;e.currentTarget.classList.add('faded');}
function tlDO(e){
  e.preventDefault();
  document.querySelectorAll('.tl-blk,.gm-hdr').forEach(el=>el.classList.remove('dl','dr'));
  const r=e.currentTarget.getBoundingClientRect();
  e.currentTarget.classList.add(e.clientX<r.left+r.width/2?'dl':'dr');
}
function tlDrp(e){
  e.preventDefault();
  const to=+e.currentTarget.dataset.si;
  const isRight=e.currentTarget.classList.contains('dr');
  document.querySelectorAll('.tl-blk,.gm-hdr').forEach(el=>el.classList.remove('dl','dr'));
  if(tlSrc===null||tlSrc===to)return;
  const m=G.secs.splice(tlSrc,1)[0];
  let dest=to>tlSrc?to-1:to;
  if(isRight)dest++;
  dest=Math.max(0,Math.min(dest,G.secs.length));
  G.secs.splice(dest,0,m);
  reIdx(tlSrc,dest);renderAll();
}
function tlDE(e){e.currentTarget.classList.remove('faded');document.querySelectorAll('.tl-blk,.gm-hdr').forEach(el=>el.classList.remove('dl','dr'));tlSrc=null;}

/* ════════════════════════════════════════════════
   ICON PICKER
════════════════════════════════════════════════ */
function buildIPHtml(defs){
  const cats={};defs.forEach(d=>{if(!cats[d.cat])cats[d.cat]=[];cats[d.cat].push(d);});
  let h='';
  for(const cat in cats){
    h+=`<div class="ipcat">${cat}</div><div class="ipgrid">`;
    cats[cat].forEach(d=>{
      h+=`<div class="ipopt" data-id="${d.id}" onclick="pickIP('${d.id}')">${d.s}<div class="ipnm">${d.name}</div></div>`;
    });
    h+='</div>';
  }
  return h;
}
function openIP(si,ii){
  G.ipTgt={si,ii};
  document.getElementById('ipSrc').value='';
  document.getElementById('ipScr').innerHTML=buildIPHtml(INSTRS);
  const cur=G.secs[si].instruments[ii]?.instrId;
  if(cur) document.querySelectorAll('.ipopt').forEach(el=>el.classList.toggle('on',el.dataset.id===cur));
  document.getElementById('ipOv').classList.add('on');
  setTimeout(()=>document.getElementById('ipSrc').focus(),80);
}
function closeIP(){document.getElementById('ipOv').classList.remove('on');}
function filterIP(q){
  const scr=document.getElementById('ipScr');
  if(!q.trim()){scr.innerHTML=buildIPHtml(INSTRS);return;}
  const f=INSTRS.filter(d=>d.name.includes(q)||d.cat.includes(q));
  scr.innerHTML=f.length?`<div class="ipgrid">${f.map(d=>`<div class="ipopt" onclick="pickIP('${d.id}')">${d.s}<div class="ipnm">${d.name}</div></div>`).join('')}</div>`:'<div class="empty">검색 결과 없음</div>';
}
function pickIP(id){
  if(!G.ipTgt)return;
  const {si,ii}=G.ipTgt;const def=INSTRS.find(d=>d.id===id);
  const instr=G.secs[si].instruments[ii];
  instr.instrId=id;
  if(!instr.name||INSTRS.some(d=>d.name===instr.name))instr.name=def.name;
  closeIP();renderEd();save();
}

function delSec(si){
  if(!confirm(`"${G.secs[si].name}" 섹션을 삭제할까요?`))return;
  G.secs.splice(si,1);
  if(G.edIdx>=G.secs.length)G.edIdx=G.secs.length?G.secs.length-1:null;
  if(G.expIdx!==null&&G.expIdx>=G.secs.length)G.expIdx=null;
  renderAll();save();
}
function dupSec(si){
  const copy=JSON.parse(JSON.stringify(G.secs[si]));
  copy.id=Date.now();copy.name+=' (복사)';
  G.secs.splice(si+1,0,copy);G.edIdx=si+1;
  renderAll();save();
}
function addInstr(si){
  const sec=G.secs[si];if(!sec.instruments)sec.instruments=[];
  sec.instruments.push({instrId:'acoustic_guitar',name:'어쿠스틱 기타',detail:''});
  const ii=sec.instruments.length-1;
  renderEd();openIP(si,ii);

function delInstr(si,ii){

}

function addSongMeta(){

  G.songMetas.push({key:last.key||'',bpm:last.bpm||'',time:last.time||''});

}
function removeSongMeta(i){
  if(G.songMetas.length<=1)return;
  G.songMetas.splice(i,1);

}

function openDash(){
  const title=gi('gTitle')||'제목 없음';

  const pages=document.getElementById('dashPages');
  pages.innerHTML='';

  pages.appendChild(buildMacroPage());
  // Pages 2+: Micro (3 sections per page)

  }
  document.getElementById('dashOv').classList.add('on');
}
function closeDash(){document.getElementById('dashOv').classList.remove('on');}
function printDash(){
  const pages=document.getElementById('dashPages').innerHTML;
  const win=window.open('','_blank','width=1200,height=900');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>편곡 대시보드</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f0f0f0;font-family:'Segoe UI',sans-serif;padding:20px;}
    ${Array.from(document.styleSheets).map(s=>{try{return Array.from(s.cssRules).map(r=>r.cssText).join('');}catch(e){return '';}}).join('')}
    @media print{body{background:#fff;padding:0;}.dash-page{box-shadow:none;margin-bottom:0;page-break-after:always;}}

</body></html>`);

function buildMacroPage(){
  const page=document.createElement('div');page.className='dash-page';
  const title=gi('gTitle')||'제목 없음';
  const genre=gi('gGenre')||'';
  const total=G.secs.reduce((s,sec)=>s+(parseInt(sec.bars)||0),0)||1;

  // Header: song info
  let metaChips='';
  G.songMetas.forEach((m,i)=>{
    if(i>0) metaChips+='<span class="dash-chip-arr">→</span>';
    if(m.key) metaChips+=`<span class="dash-chip">${m.key}</span>`;
    if(m.bpm) metaChips+=`<span class="dash-chip dash-chip-bpm">${m.bpm} BPM</span>`;
    if(m.time) metaChips+=`<span class="dash-chip dash-chip-time">${m.time}</span>`;
  });
  if(genre) metaChips+=`<span class="dash-chip dash-chip-genre">${genre}</span>`;

  // Visual timeline blocks
  let tlHTML='';
  G.secs.forEach(sec=>{
    const bars=parseInt(sec.bars)||1;
    const flex=bars/total;
    tlHTML+=`<div class="dash-tl-blk" style="flex:${flex};background:${sec.color}">
      <div class="dash-tl-nm">${sec.name}</div>
      <div class="dash-tl-sub">${bars}마디${sec.repeat>1?' ×'+sec.repeat:''}</div>
    </div>`;
  });

  // Section summary table
  let tableRows='';
  let prev={key:(G.songMetas[0]||{}).key||'',bpm:(G.songMetas[0]||{}).bpm||'',time:(G.songMetas[0]||{}).time||''};
  G.secs.forEach((sec,si)=>{
    ensureCG(sec);
    const mo=sec.meta||{};
    const curr={key:mo.key||prev.key,bpm:mo.bpm||prev.bpm,time:mo.time||prev.time};
    const instrNames=(sec.instruments||[]).map(instr=>{
      const def=INSTRS.find(d=>d.id===instr.instrId);
      return instr.name||(def?def.name:'악기');
    }).join(', ')||'–';
    const metaStr=[
      curr.key?curr.key:'',
      curr.bpm?curr.bpm+' BPM':'',
      curr.time?curr.time:''
    ].filter(Boolean).join(' / ')||'–';
    const changed=(si>0&&(mo.key||mo.bpm||mo.time))?'⚑ ':'';
    tableRows+=`<tr>
      <td><span class="dash-dot" style="background:${sec.color}"></span>${changed}${sec.name}</td>
      <td>${parseInt(sec.bars)||0}마디${sec.repeat>1?' ×'+sec.repeat:''}</td>
      <td>${metaStr}</td>
      <td>${instrNames}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sec.memo?sec.memo.substring(0,60)+(sec.memo.length>60?'…':''):'–'}</td>
    </tr>`;
    prev=curr;
  });

  const pageNum=G.secs.length?`총 ${G.secs.length}개 섹션 · ${total}마디`:'섹션 없음';

  page.innerHTML=`

function buildMicroPage(secs,startIdx){
  const page=document.createElement('div');page.className='dash-page';
  const pageNum=Math.floor(startIdx/3)+2;
  const totalPages=Math.ceil(G.secs.length/3)+1;

  let cardsHTML='';
  secs.forEach((sec,ri)=>{
    const si=startIdx+ri;
    ensureCG(sec);
    const mo=sec.meta||{};
    const gm=G.songMetas[0]||{};

    // Meta for this section
    const metaChips=[];
    if(mo.key||gm.key) metaChips.push(`<span class="dash-mc-chip">${mo.key||gm.key}</span>`);
    if(mo.bpm||gm.bpm) metaChips.push(`<span class="dash-mc-chip" style="background:#fff3e8;color:#c2540a">${mo.bpm||gm.bpm} BPM</span>`);
    if(mo.time||gm.time) metaChips.push(`<span class="dash-mc-chip" style="background:#e8f5e9;color:#2e7d32">${mo.time||gm.time}</span>`);

    // Instruments
    const instrTags=(sec.instruments||[]).map(instr=>{
      const def=INSTRS.find(d=>d.id===instr.instrId)||INSTRS[INSTRS.length-2];
      const nm=instr.name||(def?def.name:'악기');
      return`<span class="dash-instr-tag">${def.s}${nm}${instr.detail?' ('+instr.detail+')':''}</span>`;
    }).join('')||'<span style="color:#aaa;font-size:10px">악기 없음</span>';

    // Chord grid (compact display)
    const {div,cells}=sec.cg;
    const bars=parseInt(sec.bars)||0;
    let chordHTML='';
    if(bars>0){
      chordHTML='<div class="dash-chord-wrap">';
      for(let b=0;b<bars;b++){
        const row=cells[b]||[];
        chordHTML+=`<div class="dash-chord-bar"><span class="dash-chord-bar-lbl">${b+1}</span>`;
        for(let c=0;c<div;c++){
          const ch=(row[c]||'').trim();
          chordHTML+=`<span class="dash-chord-cell${!ch?' em':''}">${ch||'–'}</span>`;
        }
        chordHTML+='</div>';
      }
      chordHTML+='</div>';
    } else {
      chordHTML='<span style="color:#aaa;font-size:10px">코드 없음</span>';
    }

    cardsHTML+=`<div class="dash-mc" style="border-left-color:${sec.color}">
      <div class="dash-mc-hdr">
        <div class="dash-mc-title">${sec.name}</div>
        <span class="dash-mc-badge">${bars}마디${sec.repeat>1?' · '+sec.repeat+'회 반복':''}</span>
        <div class="dash-mc-meta">${metaChips.join('')}</div>
      </div>
      <div class="dash-mc-grid">
        <div>
          <div class="dash-mc-lbl">악기 레이어</div>
          <div class="dash-instr-list">${instrTags}</div>
        </div>
        <div>
          <div class="dash-mc-lbl">메모 / 편곡 아이디어</div>
          ${sec.memo?`<div class="dash-memo">${esc(sec.memo)}</div>`:'<span style="color:#aaa;font-size:10px">메모 없음</span>'}
        </div>
        <div class="dash-mc-full">
          <div class="dash-mc-lbl">코드 진행 (${{1:'마디',4:'4분할',8:'8분할'}[div]})</div>
          ${chordHTML}
        </div>
      </div>
    </div>`;
  });

  page.innerHTML=`
    <div class="dash-pg-hdr">
      <div><div class="dash-song-title" style="font-size:16px">미시적 차트 (Micro) — 섹션별 상세</div></div>
      <div class="dash-pg-num">Page ${pageNum} / ${totalPages}</div>
    </div>
    ${cardsHTML}`;
  return page;
}

function goSectionVM(){
  G.vm='section';
  document.querySelectorAll('.vmb').forEach(b=>b.classList.toggle('on',b.dataset.vm==='section'));
  renderTL();
}
function setVM(btn){
  G.vm=btn.dataset.vm;
  document.querySelectorAll('.vmb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderTL();
}

/* ════════════════════════════════════════════════
   SAVE / LOAD
════════════════════════════════════════════════ */
function gi(id){return(document.getElementById(id)||{}).value||'';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function getData(){
  return{v:4,title:gi('gTitle'),genre:gi('gGenre'),songMetas:G.songMetas,secs:G.secs};
}
function save(){localStorage.setItem('apb4',JSON.stringify(getData()));}
function doExport(){
  const d=getData();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.download=(d.title||'편곡보드')+'.json';a.click();
}
function doImport(){document.getElementById('fileIn').click();}
function loadFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      G.secs=d.secs||d.sections||[];G.expIdx=null;G.edIdx=null;G.edOpen=false;
      G.secs.forEach(migrateSec);
      setField('gTitle',d.title||d.songTitle||'');
      setField('gGenre',d.genre||d.songGenre||'');
      if(d.songMetas&&d.songMetas.length) G.songMetas=d.songMetas;
      else G.songMetas=[{key:d.key||d.songKey||'',bpm:d.bpm||d.songBpm||'',time:d.time||d.songTime||''}];
      closeWelcome();renderAll();save();alert('✅ 불러오기 완료!');
    }catch(err){alert('❌ 오류: '+err.message);}
  };
  r.readAsText(f);ev.target.value='';
}
function setField(id,v){const el=document.getElementById(id);if(el)el.value=v;}

/* ════════════════════════════════════════════════
   WELCOME SCREEN & NEW PROJECT
════════════════════════════════════════════════ */
function showWelcome(){
  document.getElementById('welcomeOv').classList.remove('hidden');
}
function closeWelcome(){
  document.getElementById('welcomeOv').classList.add('hidden');
}
function newProject(){
  closeWelcome();
  clearProject();
}
function importFromWelcome(){
  closeWelcome();
  doImport();
}
function clearProject(){
  G.secs=[];G.expIdx=null;G.edIdx=null;G.edOpen=false;
  G.songMetas=[{key:'',bpm:'',time:''}];
  setField('gTitle','');setField('gGenre','');
  renderAll();save();
}
function newProjectFromHeader(){
  if(G.secs.length>0){
    document.getElementById('newProjDlg').classList.add('on');
  } else {
    // 작업 중인 섹션 없으면 웰컴 스크린으로
    clearProject();
    showWelcome();
  }
}
function closeNewProjDlg(){document.getElementById('newProjDlg').classList.remove('on');}
function doNewProjSave(){
  doExport();
  // 파일 다운로드 후 초기화
  setTimeout(()=>{closeNewProjDlg();clearProject();},400);
}
function doNewProjDiscard(){
  closeNewProjDlg();
  clearProject();
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
function init(){
  // Load saved data
  const raw=localStorage.getItem('apb4')||localStorage.getItem('arrangeBoard_v3')||localStorage.getItem('arrangementBoard_v2')||localStorage.getItem('arrangementBoard');
  let hasSaved=false;
  if(raw){
    try{
      const d=JSON.parse(raw);
      G.secs=d.secs||d.sections||[];
      G.secs.forEach(migrateSec);
      setField('gTitle',d.title||d.songTitle||'');
      setField('gGenre',d.genre||d.songGenre||'');
      if(d.songMetas&&d.songMetas.length) G.songMetas=d.songMetas;
      else G.songMetas=[{key:d.key||d.songKey||'',bpm:d.bpm||d.songBpm||'',time:d.time||d.songTime||''}];
      hasSaved=G.secs.length>0;
    }catch(e){}
  }

  // Auto-save on header input change
  ['gTitle','gGenre'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',()=>{renderTL();save();});
  });

  // Close popups on overlay/background click
  document.getElementById('addDlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAddDlg();});
  document.getElementById('ipOv').addEventListener('click',e=>{if(e.target===e.currentTarget)closeIP();});
  document.getElementById('newProjDlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeNewProjDlg();});
  document.addEventListener('click',e=>{
    if(!e.target.closest('.mpop')&&!e.target.closest('.ms'))closeMPop();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeAddDlg();closeIP();closeMPop();closeDash();closeNewProjDlg();}
    if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();openAddDlg();}
  });

  renderAll();

  // 저장된 프로젝트가 없으면 웰컴 화면 표시
  if(!hasSaved) showWelcome();
}

init();
</script>
